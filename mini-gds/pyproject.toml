[project]
name = "mini-gds"
version = "0.1.0"
description = "Runs the components together as one system: host, availability cache, search and reservation."
readme = "README.md"
authors = [
    { name = "Felix Sastre", email = "2602673+felixsastre@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "booking-domain",
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "inventory-nesting",
    "od-availability",
    "offer-engine",
    "temporalio>=1.35.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
bdd_features_base_dir = "features"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv.sources]
inventory-nesting = { path = "../inventory-nesting", editable = true }
offer-engine = { path = "../offer-engine", editable = true }
booking-domain = { path = "../booking-domain", editable = true }
od-availability = { path = "../od-availability", editable = true }

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-bdd>=9.0.1",
    "ruff>=0.17.3",
]
